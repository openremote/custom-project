# OpenRemote v3
#
# Profile for doing keycloak custom theme development
#
# Please see profile/deploy.yml for configuration details for each service.
#
x-base: &base https://github.com/openremote/openremote.git#1.30.0:profile/deploy.yml

services:
  keycloak:
    extends:
      file: *base
      service: keycloak
    ports:
      - "8081:8080"
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    extends:
      file: *base
      service: postgresql
    volumes:
      - ../openremote/tmp:/storage
    ports:
      - "5432:5432"
