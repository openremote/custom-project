# OpenRemote v3
#
# Profile for doing keycloak custom theme development
#
# Please see profile/deploy.yml for configuration details for each service.
#
x-base: &base https://github.com/openremote/core.git#1.33.0:profile/deploy.yml

services:
  keycloak:
    extends:
      file: *base
      service: keycloak
    ports:
      - "8081:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # manager has a different base URL and is assumed to be reachable at this URL
      OR_MANAGER_URL: ${OR_MANAGER_URL:-http://127.0.0.1:8080}

  postgresql:
    extends:
      file: *base
      service: postgresql
    volumes:
      - ../openremote/tmp:/storage
    ports:
      - "5432:5432"
